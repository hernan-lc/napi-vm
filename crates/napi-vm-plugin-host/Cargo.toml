[package]
name = "napi-vm-plugin-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Independent trusted process plugin host"
[dependencies]
napi-vm-plugin-protocol = { path = "../napi-vm-plugin-protocol", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs", "signal"] }
napi-vm-plugin-sdk = { path = "../napi-vm-plugin-sdk", version = "0.1.0" }
sha2 = "0.10"
getrandom = "0.3"
