[package]
name = "napi-vm"
version = "0.1.0"
edition = "2024"

[lib]
# `cdylib` is the NAPI shared library; `lib` (rlib) lets Rust benchmarks and
# integration tests link against the crate directly.
crate-type = ["cdylib", "lib"]

[features]
default = []
# SGR mouse-event parser + ANSI tracking sequences, exposed to JS
# (parseMouseEvent / mouseEnableSeq / mouseDisableSeq). Independent of the
# inspector; off by default to keep the default NAPI surface minimal.
mouse = []
# Native object inspector (DevTools-style foldable tree), implemented on the
# guest `Value`. A non-blocking inline tree dump — it prints closed by
# default (open it with `INSPECTOR_DEPTH` / setInspectorConfig) and returns
# immediately: no session, no raw mode, no mouse, nothing to close. Off by
# default to keep the default NAPI surface minimal; adds no dependencies.
inspector = []

[dependencies]
napi = { version = "3.12.0", features = ["napi8"] }
napi-derive = "3.6.1"
smallvec = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vm"
harness = false

# Interpreter hot paths benefit from whole-program optimization and a single
# codegen unit. `panic` stays at the default (unwind) because the NAPI layer
# catches panics across the boundary.
[profile.release]
lto = "thin"
codegen-units = 1
