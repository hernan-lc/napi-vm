[package]
name = "napi-vm"
version = "0.1.0"
edition = "2024"

[lib]
# `cdylib` is the NAPI shared library; `lib` (rlib) lets Rust benchmarks and
# integration tests link against the crate directly.
crate-type = ["cdylib", "lib"]

[features]
default = []
# SGR mouse-event parser + ANSI tracking sequences for the TUI inspector.
# Off by default: mouse mode changes global terminal behavior and is
# meaningless in CI / piped environments.
mouse = []
# Interactive terminal object inspector (DevTools-style foldable tree),
# implemented natively on the guest `Value`. Off by default: an interactive
# session enables raw mode + mouse capture until closed (it renders inline
# and never takes over the screen) and is meaningless in CI / piped
# environments, where it transparently falls back to a static dump. Implies
# `mouse`, so `--features inspector` is enough to build the full inspector
# and its NAPI surface.
inspector = ["mouse", "dep:crossterm"]

[dependencies]
napi = { version = "3.12.0", features = ["napi8"] }
napi-derive = "3.6.1"
smallvec = "1"
# Cross-platform raw-mode input, key events, terminal size and alternate
# screen for the `inspector` feature. Optional so the default build stays
# dependency-light and never touches the terminal.
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vm"
harness = false

# Interpreter hot paths benefit from whole-program optimization and a single
# codegen unit. `panic` stays at the default (unwind) because the NAPI layer
# catches panics across the boundary.
[profile.release]
lto = "thin"
codegen-units = 1
