[package]
name = "trusted-greeter-template"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[dependencies]
napi-vm-plugin-sdk = { path = "vendor/napi-vm-plugin-sdk" }
napi-vm-plugin-protocol = { path = "vendor/napi-vm-plugin-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
