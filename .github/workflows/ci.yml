name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux x86_64 ──────────────────────────────────────────────────────
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests (full)
        run: cargo test --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Verify LSP binary runs
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":"file:///tmp","capabilities":{}}}' \
            | (timeout 2s ./target/release/napi-vm-lsp || true)

      - name: Run JS tests
        uses: oven-sh/setup-bun@v2
      - run: bun test

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-vm-linux-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-vm-lsp-linux-x64
          path: target/release/napi-vm-lsp

  # ── Windows x86_64 ────────────────────────────────────────────────────
  win-x64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests (full)
        run: cargo test --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-vm-win-x64
          path: "*.node"

      - name: Upload LSP artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-vm-lsp-win-x64
          path: target/release/napi-vm-lsp.exe
