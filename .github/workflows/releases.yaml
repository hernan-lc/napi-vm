name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release is published only after the exact tagged commit passes the
  # native, core-only, JavaScript, and subprocess crash-safety suites.
  verify:
    name: Verify tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify checkout is the tagged SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Run Rust tests
        run: cargo test --release

      - name: Run core-only Rust tests
        run: cargo test --release --no-default-features

      - name: Run Rust lint checks
        run: cargo clippy --all-targets -- -D warnings

      - name: Run JavaScript tests
        run: bun test

      - name: Run subprocess crash catalogue
        run: bun examples/crash.ts

  # ── Linux x86_64 ──────────────────────────────────────────────────────
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      # A musl build in addition to the glibc one: a binary linked against a
      # recent glibc fails with `GLIBC_x.xx not found` on older distributions,
      # while the musl build is statically linked and runs everywhere.
      - name: Build napi-vm-lsp (musl, static)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --no-default-features --bin napi-vm-lsp \
            --target x86_64-unknown-linux-musl

      - name: Package LSP binaries
        run: |
          mkdir -p lsp-dist
          cp target/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          tar czf napi-vm-lsp-linux-x64.tar.gz -C lsp-dist napi-vm-lsp
          cp target/x86_64-unknown-linux-musl/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          tar czf napi-vm-lsp-linux-x64-musl.tar.gz -C lsp-dist napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-x64
          path: "*.node"

      # The generated NAPI loader and types are build outputs, not checked-in
      # files: the release job consumes these artifacts instead of copying
      # whatever happens to be committed in a fresh checkout.
      - name: Upload npm runtime files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-runtime
          path: |
            index.js
            index.d.ts

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-linux-x64
          path: napi-vm-lsp-linux-x64*.tar.gz

  # ── Linux aarch64 ─────────────────────────────────────────────────────
  linux-arm64:
    name: Linux aarch64
    runs-on: ubuntu-24.04-arm
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Build napi-vm-lsp (musl, static)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build --release --no-default-features --bin napi-vm-lsp \
            --target aarch64-unknown-linux-musl

      - name: Package LSP binaries
        run: |
          mkdir -p lsp-dist
          cp target/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          tar czf napi-vm-lsp-linux-arm64.tar.gz -C lsp-dist napi-vm-lsp
          cp target/aarch64-unknown-linux-musl/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          tar czf napi-vm-lsp-linux-arm64-musl.tar.gz -C lsp-dist napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-linux-arm64
          path: "*.node"

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-linux-arm64
          path: napi-vm-lsp-linux-arm64*.tar.gz

  # ── macOS aarch64 (Apple Silicon) ─────────────────────────────────────
  darwin-arm64:
    name: macOS aarch64
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Package LSP binary
        run: |
          mkdir -p lsp-dist
          cp target/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          cd lsp-dist
          tar czf ../napi-vm-lsp-darwin-arm64.tar.gz napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-arm64
          path: "*.node"

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-darwin-arm64
          path: napi-vm-lsp-darwin-arm64.tar.gz

  # ── macOS x86_64 ──────────────────────────────────────────────────────
  darwin-x64:
    name: macOS x86_64
    runs-on: macos-15-intel
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Package LSP binary
        run: |
          mkdir -p lsp-dist
          cp target/release/napi-vm-lsp lsp-dist/napi-vm-lsp
          cd lsp-dist
          tar czf ../napi-vm-lsp-darwin-x64.tar.gz napi-vm-lsp

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-darwin-x64
          path: "*.node"

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-darwin-x64
          path: napi-vm-lsp-darwin-x64.tar.gz

  # ── Windows x86_64 ────────────────────────────────────────────────────
  win-x64:
    name: Windows x86_64
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npx napi build --platform --release

      - name: Build napi-vm-lsp (no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp

      - name: Package LSP binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lsp-dist
          Copy-Item target/release/napi-vm-lsp.exe lsp-dist/napi-vm-lsp.exe
          Compress-Archive -Path lsp-dist/napi-vm-lsp.exe -DestinationPath napi-vm-lsp-windows-x64.zip

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-x64
          path: "*.node"

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-windows-x64
          path: napi-vm-lsp-windows-x64.zip

  # ── Windows aarch64 ───────────────────────────────────────────────────
  win-arm64:
    name: Windows aarch64
    runs-on: windows-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # v1.2.0
        with:
          toolchain: 1.96.0
          targets: aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module (cross-compile to arm64)
        run: npx napi build --platform --release --target aarch64-pc-windows-msvc

      - name: Build napi-vm-lsp (cross-compile, no-default-features)
        run: cargo build --release --no-default-features --bin napi-vm-lsp --target aarch64-pc-windows-msvc

      - name: Package LSP binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force lsp-dist
          Copy-Item target/aarch64-pc-windows-msvc/release/napi-vm-lsp.exe lsp-dist/napi-vm-lsp.exe
          Compress-Archive -Path lsp-dist/napi-vm-lsp.exe -DestinationPath napi-vm-lsp-windows-arm64.zip

      - name: Upload .node artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-win-arm64
          path: "*.node"

      - name: Upload LSP archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: napi-vm-lsp-windows-arm64
          path: napi-vm-lsp-windows-arm64.zip

  # ── Create Release ────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [linux-x64, linux-arm64, darwin-arm64, darwin-x64, win-x64, win-arm64]
    steps:
      # No checkout: every published file must come from a build job's
      # artifacts, so a stale generated `index.js` in the repository can never
      # end up in a release.
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          # .node files for the Node/Electron N-API layer
          find artifacts -name '*.node' -exec cp {} release/ \;
          # Generated NAPI loader + types, straight from the canonical build job
          cp artifacts/index.js artifacts/index.d.ts release/
          # napi-vm-lsp native LSP binaries for all platforms
          find artifacts -name '*.tar.gz' -exec cp {} release/ \;
          find artifacts -name '*.zip' -exec cp {} release/ \;
          echo "=== Release files ==="
          ls -lh release/

      # The Zed extension looks these names up verbatim, and expects the
      # executable at the archive root. Fail the release rather than publish
      # assets the extension cannot find or unpack.
      - name: Verify LSP assets match the Zed extension's lookup
        run: |
          set -euo pipefail
          for asset in \
            napi-vm-lsp-linux-x64.tar.gz \
            napi-vm-lsp-linux-arm64.tar.gz \
            napi-vm-lsp-darwin-x64.tar.gz \
            napi-vm-lsp-darwin-arm64.tar.gz \
            napi-vm-lsp-windows-x64.zip \
            napi-vm-lsp-windows-arm64.zip
          do
            test -f "release/$asset" || { echo "missing $asset"; exit 1; }
          done
          for archive in release/*.tar.gz; do
            entries="$(tar tzf "$archive")"
            test "$entries" = "napi-vm-lsp" \
              || { echo "$archive must contain napi-vm-lsp at its root, got: $entries"; exit 1; }
          done
          for archive in release/*.zip; do
            unzip -Z1 "$archive" | grep -qx 'napi-vm-lsp.exe' \
              || { echo "$archive must contain napi-vm-lsp.exe at its root"; exit 1; }
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
