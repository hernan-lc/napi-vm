name: Runtime compatibility
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Install Bun
        shell: bash
        run: npm install --global bun@1.3.14
      - run: npm ci --ignore-scripts
      - run: npm run build:all
      - run: npm run test:node
      - run: npm test
      - name: Feature combinations and generated sources
        if: matrix.node == 22
        shell: bash
        run: |
          cargo test --release
          cargo test --release --all-features
          cargo test --no-default-features
          npm run check:generated
          npm run lint
      - name: Serialized memory regression
        if: matrix.os == 'ubuntu-24.04' && matrix.node == 22
        run: cargo test --release --no-default-features --test compiler_memory -- --test-threads=1
  focused-miri:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --no-default-features --lib shape::tests
